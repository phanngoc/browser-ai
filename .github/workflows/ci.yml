name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: extension syntax
        run: node --check extension/background.js && node --check extension/popup.js && python3 -c "import json;json.load(open('extension/manifest.json'))"
      - name: Chrome for Testing
        # Branded Chrome ignores --load-extension; Chrome for Testing runs the extension e2e.
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/.cache/cft" >/dev/null
          echo "CHROME_PATH=$(find "$HOME/.cache/cft" -type f -name chrome -path '*chrome-linux64*' | head -1)" >> "$GITHUB_ENV"
      - name: test
        run: go test -race -count=1 ./...
