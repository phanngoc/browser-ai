<!doctype html>
<meta charset="utf-8">
<title>browser-ai bridge</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 2px; color: #555; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; padding: 6px; border-radius: 4px; border: 1px solid #999; background: #f6f6f6; font: inherit; cursor: pointer; }
  button.primary { background: #0a7; border-color: #0a7; color: #fff; }
  #status { margin-top: 10px; padding: 6px 8px; border-radius: 4px; background: #eee; }
  #status.connected { background: #d9f5e8; } #status.connecting { background: #fff3cd; }
  .hint { color: #777; font-size: 12px; margin-top: 8px; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
</style>
<h1>browser-ai bridge</h1>
<label for="port">Agent port</label>
<input id="port" type="number" min="1" max="65535">
<label for="token">Token (printed by <code>agent --via-extension</code>)</label>
<input id="token" type="text" autocomplete="off" spellcheck="false">
<div class="check"><input id="allowCurrentTab" type="checkbox"><label for="allowCurrentTab" style="margin:0">Allow driving the current tab</label></div>
<div class="check"><input id="autoconnect" type="checkbox"><label for="autoconnect" style="margin:0">Connect automatically</label></div>
<div class="row">
  <button id="connect" class="primary">Connect</button>
  <button id="disconnect">Disconnect</button>
</div>
<div id="status">off</div>
<div class="hint">The agent opens its own background tab and closes it when done. Chrome shows a “debugging this browser” bar while a tab is attached — that is expected.</div>
<script src="popup.js"></script>
